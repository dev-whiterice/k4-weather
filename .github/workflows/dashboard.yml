name: dashboard

on:
  schedule:
    # Every 30 minutes. The GitHub Actions cron is not punctual: at peak hours
    # the delay reaches 15-20 minutes and the odd run is skipped. The Kindle
    # wakes up offset by 15 minutes (see kindle/local/env.sh) and the image
    # always carries its generation time.
    - cron: "0,30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.yaml"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write

# Never two renders at once: they would race to force-push the output branch.
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on requirements.txt because that is where the playwright
          # version is pinned: a bump has to pull a matching browser.
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Render every location
        run: PYTHONPATH=src python -m k4weather generate --out-dir out

      - name: Check that the PNGs are digestible by eips
        run: PYTHONPATH=src python -m k4weather inspect out

      - name: Prepare the directory to publish
        run: |
          set -eu
          mkdir -p publish
          # One image per location plus the manifest that ties them together.
          # Nothing here is renamed: the Kindle asks for the file name the
          # manifest gives it, so this copy is the whole contract.
          cp out/dashboard-*.png publish/
          cp out/locations.json out/locations.txt publish/
          touch publish/.nojekyll
          printf '{"generated_at":"%s","run":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" > publish/meta.json
          echo "published $(ls publish/dashboard-*.png | wc -l) location(s)" \
            >> "$GITHUB_STEP_SUMMARY"
          # The preview page reads the manifest rather than having the list
          # baked into it, so adding a location to config.yaml is enough.
          cat > publish/index.html <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>k4-weather</title>
          <style>
            body{margin:0;padding:24px;background:#111;font:14px system-ui;color:#888;
                 display:flex;flex-wrap:wrap;gap:24px;justify-content:center;
                 align-items:flex-start}
            figure{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}
            img{width:min(600px,92vw);image-rendering:pixelated;
                background:#fff;box-shadow:0 8px 40px #0008}
            figcaption{color:#bbb}
            footer{flex-basis:100%;text-align:center}
            a{color:#888}
          </style>
          <script>
          // Fails visibly rather than silently: a blank page here means the
          // manifest is missing, which is the same fault the Kindle would hit.
          fetch('locations.json', {cache: 'no-store'})
            .then(response => response.json())
            .then(manifest => {
              document.body.innerHTML = manifest.locations.map(location => `
                <figure>
                  <img src="${location.image}" alt="${location.name}">
                  <figcaption>${location.name}</figcaption>
                </figure>`).join('') + `
                <footer>updated every 30 minutes ·
                  <a href="locations.json">locations.json</a> ·
                  <a href="meta.json">meta.json</a></footer>`;
            })
            .catch(error => {
              document.body.textContent = 'locations.json unreadable: ' + error;
            });
          </script>
          HTML

      - name: Publish the image
        env:
          # By default the image goes to the `output` branch of this same
          # repository, which is public because the Kindle cannot authenticate.
          # Setting the PUBLISH_REPO variable diverts it elsewhere, useful if
          # the code ever goes private again.
          PUBLISH_REPO: ${{ vars.PUBLISH_REPO || github.repository }}
          PUBLISH_BRANCH: ${{ vars.PUBLISH_BRANCH || 'output' }}
          # Fine-grained PAT with contents:write on the destination repo.
          # It also keeps the scheduler alive: GitHub disables scheduled
          # workflows after 60 days and commits made with the automatic token
          # do not count as activity.
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$PUBLISH_REPO" != "$GITHUB_REPOSITORY" ] && [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::PUBLISH_REPO points at ${PUBLISH_REPO} but the PUBLISH_TOKEN secret is missing"
            exit 1
          fi
          cd publish
          git init -q
          git checkout -q -b "$PUBLISH_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "dashboard $(date -u +%Y-%m-%dT%H:%MZ)"

          # Force push of a single history-less commit: the branch stays a
          # constant size instead of piling up 48 PNGs a day.
          push_with() {
            git push -qf "https://x-access-token:$1@github.com/${PUBLISH_REPO}.git" \
              "$PUBLISH_BRANCH"
          }

          if [ -n "$PUBLISH_TOKEN" ] && push_with "$PUBLISH_TOKEN"; then
            echo "published to ${PUBLISH_REPO}@${PUBLISH_BRANCH} with PUBLISH_TOKEN" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # An expired PUBLISH_TOKEN, or one with the wrong permissions, must
          # not freeze the dashboard: on this same repository the automatic
          # token can write anyway, and the fault stays visible as a warning.
          if [ -n "$PUBLISH_TOKEN" ]; then
            if [ "$PUBLISH_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::PUBLISH_TOKEN rejected by ${PUBLISH_REPO} and there is no possible fallback on another repository"
              exit 1
            fi
            echo "::warning::PUBLISH_TOKEN rejected by ${PUBLISH_REPO}: check expiry, repository access and the contents:write permission. Publishing with the automatic token, but the scheduler will go back to switching itself off after 60 days of inactivity."
          fi

          push_with "$FALLBACK_TOKEN"
          echo "published to ${PUBLISH_REPO}@${PUBLISH_BRANCH} with the automatic token" \
            >> "$GITHUB_STEP_SUMMARY"

      # Kept even on failure: the HTML is what tells a broken layout apart from
      # a broken conversion.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: |
            out/dashboard-*.png
            out/dashboard-*.html
            out/locations.json
          retention-days: 3
