[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4weather"
version = "0.1.0"
description = "Dashboard meteo e-ink per Kindle 4 jailbroken, generata da GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "requests>=2.32",
    "playwright>=1.44",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k4weather = ["templates/*.j2", "templates/*.css", "templates/icons/*.svg", "templates/fonts/*.woff2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: richiede Chromium headless"]
