# k4-weather configuration.
#
# The panel shows one location at a time and the Kindle's page buttons walk
# through the list below: the first entry is the primary — the one on screen
# after an install — and the order here is the order the buttons follow.
#
# `id` is written by hand, not derived from `name`: it becomes a file name and
# a URL, and it is what the device remembers between reboots. Lowercase ASCII,
# digits and dashes. Change an id and you have created a different location,
# which is the point — reordering or renaming then costs nothing, because
# nothing anywhere refers to a position in this list.

locations:
  - id: caoria
    name: "Caoria"
    latitude: 46.19647
    longitude: 11.67804
    # "auto" lets Open-Meteo resolve the timezone from the coordinates
    timezone: "auto"

  - id: fumane
    name: "Fumane"
    latitude: 45.54160
    longitude: 10.88548
    timezone: "auto"

  - id: castel-dazzano
    name: "Castel d'Azzano"
    latitude: 45.35588
    longitude: 10.95299
    timezone: "auto"

  - id: ferrara-monte-baldo
    name: "Ferrara di Monte Baldo"
    latitude: 45.67408
    longitude: 10.85911
    timezone: "auto"

  - id: verona
    name: "Verona"
    latitude: 45.43854
    longitude: 10.99380
    timezone: "auto"

units:
  temperature: "celsius"      # celsius | fahrenheit
  wind_speed: "kmh"           # kmh | ms | mph | kn
  precipitation: "mm"         # mm | inch

display:
  width: 600
  height: 800
  # Days shown in the forecast grid, on top of today (1-15)
  forecast_days: 7
  # Hours shown in the hourly chart (1-48)
  hourly_hours: 24
  # Gray levels of the Kindle 4 e-ink panel
  gray_levels: 16
  # Supersampling factor at screenshot time (1 = sharper, hinted text)
  scale_factor: 1

features:
  air_quality: true
  moon_phase: true
  sun_times: true
  # Reserves the blank the Kindle writes its own temperature into.
  # Pointless without the client on the device: see kindle/README.md.
  indoor_temperature: true
  # The same, for the battery level it writes in the footer.
  battery: true
